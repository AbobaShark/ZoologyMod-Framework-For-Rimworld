name: Checker tests

on:
  push:
    branches: [main]
    paths:
      - 'checker/**'
      - '.github/workflows/checker-tests.yml'
  pull_request:
    paths:
      - 'checker/**'
      - '.github/workflows/checker-tests.yml'
  workflow_dispatch:

jobs:
  checker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: checker/requirements.txt
      - name: Install Checker dependencies
        run: |
          python -m pip install -r checker/requirements.txt pytest
      - name: Check Python syntax
        run: python -m compileall -q checker
      - name: Test leather, textile and Reference Sync
        working-directory: checker
        run: |
          python -m pytest -q tests/test_leather_routing.py tests/test_leather_generation.py tests/test_leather_original_overrides.py tests/test_leather_cleanup.py tests/test_animal_textiles.py tests/test_reference_sync_auto.py
